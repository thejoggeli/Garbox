[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / memory configuration ---
board_build.flash_size = 8MB
board_build.psram = enabled

; --- Serial / upload configuration ---
monitor_speed = 115200
upload_port = /dev/ttyACM0
upload_protocol = esptool
upload_speed = 115200

; --- Override default C++11 with modern standard ---
build_unflags = -std=gnu++11

; --- Custom compiler flags ---
build_flags =
    -std=gnu++17                 ; Use GNU C++17 (required for inline constexpr, modern features)
    -Wall                        ; Enable general warnings
    -Wextra                      ; Enable additional useful warnings
    -Wreorder                    ; Warn on member init order mismatches
    -Werror=reorder              ; Treat reordering as an error
    -Wshadow                     ; Warn when local var shadows member/global
    -Wuninitialized              ; Warn on possibly uninitialized variables
    -Wlogical-op                 ; Warn on suspicious logical comparisons
    -O2                          ; Optimization level
    -DARDUINO_USB_MODE=1         ; CDC USB mode
    -DARDUINO_USB_CDC_ON_BOOT=1  ; Enable USB serial at startup

; --- Libraries ---
lib_deps =
    adafruit/Adafruit NeoPixel

; --- Optional debug helpers ---
; build_type = debug            ; Uncomment to build with debug symbols (-Og)
; monitor_filters = esp32_exception_decoder, colorize
