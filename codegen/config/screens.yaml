screens:
  Main:
    receives: [Heartbeat]
    sends: [SetBrightness]
    states:
      Fan: [
        {source: Event, type: FanStatus, field: enabled},
        {source: Event, type: FanStatus, field: state},
        {source: Event, type: FanStatus, field: targetSpeed, epsilon: 1e-4},
        {source: Event, type: FanSample, field: measuredRpm, epsilon: 1e-4},
      ]
      HeaterStatus: [
        {source: Event, type: HeaterStatus, field: enabled},
        {source: Event, type: HeaterStatus, field: dutyCycle, epsilon: 1e-4}
      ] 
      HeaterSample: [
        {source: Event, type: HeaterSample, field: measuredVoltage, epsilon: 1e-4},
        {source: Event, type: HeaterSample, field: measuredCurrent, epsilon: 1e-4},
      ]
