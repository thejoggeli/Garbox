screens:

  Simple: 
    subdir: simple
    renderer: lvgl-gui
    renderer_gui: SimpleScreen.xml
    render_fns: 
      - EngineStatus
      - TargetTemperature
      - MeasuredTemperature
      - MeasuredHumidity
      - HeaterPower
      - FanStatus
    read_states:
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - TemperatureStatus
      - TemperatureSample
      - FermentationStatus
    receive_events: 
      - Button
      - ButtonRepeat
      - EncoderStep
    send_events:
      - RequestFermentationMode
      - RequestTargetTemperature

  Main:
    subdir: main
    renderer: lvgl-gui # lvgl-simple or lvgl-gui 
    tick_phases: [UserInput]
    renderer_gui: MainScreen.xml
    render_fns: 
      - FanInfo 
      - PowerInfo 
      - HumidityInfo
      - StatusInfo
      - MeasuredTemperatureLabel
      - HeatpadPowerLabel
      - TimeAxis
      - TimeSeries
      - Menu
    read_states: 
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - TemperatureStatus
      - TemperatureSample
      - FermentationStatus
    send_events:
      - RequestFermentationMode
      - RequestTargetTemperature
      - RequestFanMode

  Debug:
    subdir: debug
    renderer: lvgl-simple # lvgl-simple or lvgl-gui 
    render_fns:
      - FanState 
      - FanMeasuredRpm 
      - HeatpadState 
      - HeatpadDuty 
      - HeatpadSense
      - HeatpadProgress 
      - DisplayStatus 
      - TemperatureState 
      - TemperatureSample 
      - Time 
      - Micros
      - AppInfo 
      - FermentationStatus 
      - HeapBlocks
      - HeapBytes
      - HeapMinimum
    read_states:
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - HeatpadProgress
      - DisplayStatus
      - DisplayDiagnostics
      - TemperatureStatus
      - TemperatureSample
      - ActiveBehaviour
      - ActiveScreen
      - FermentationStatus

  EventLog:
    subdir: log
    renderer: lvgl-simple # lvgl-simple or lvgl-gui 
    receive_events_all: true
    
  StateLog:
    subdir: log
    renderer: lvgl-simple # lvgl-simple or lvgl-gui 
    read_states_all: true