screens:
  Main:
    tick_phases: null
    receives: null
    sends: 
      - DisplayCommand
    updaters:
      FanState:
        - { event: FanStatus, name: state }
        - { event: FanStatus, name: targetSpeed }
      FanMeasuredRpm:
        - { event: FanSample, name: measuredRpm }
      HeatpadState:
        - { event: HeatpadStatus, name: state }
      HeatpadDuty:
        - { event: HeatpadStatus, name: currentDutyCycle }
        - { event: HeatpadStatus, name: currentPeriodMicros }
        - { event: HeatpadStatus, name: nextDutyCycle }
        - { event: HeatpadStatus, name: nextPeriodMicros }
      BoxPosition:
        - { event: HeatpadSample, name: pwmProgressMicros }
      HeatpadSense:
        - { event: HeatpadSample, name: measuredVoltage, epsilon: 1e-3 }
        - { event: HeatpadSample, name: measuredCurrent, epsilon: 1e-3 }
      DisplayStatus:
        - { event: DisplayStatus, name: brightness }
        - { event: DisplayStatus, name: skipped }
      TemperatureState:
        - { event: TemperatureStatus, name: driverEnabled }
        - { event: TemperatureStatus, name: powerEnabled }
        - { event: TemperatureStatus, name: resetting }
      TemperatureSample:
        - { event: TemperatureSample, name: temperatureCelcius }
        - { event: TemperatureSample, name: humidityRelative }
      HeapSpace:
        - { name: heapSpace, type: uint32_t }
      AppInfo:
        - { name: eventCount, type: uint32_t }
        - { event: ActiveBehaviourChanged, name: newBehaviour }
      FermentationStatus:
        - { event: FermentationStatus, name: heaterEngineState }
        - { event: FermentationStatus, name: targetTemperature }
        - { event: FermentationStatus, name: measuredTemperature }
        - { event: FermentationStatus, name: measuredHumidity }

  Debug:
    tick_phases: null
    receives: [Heartbeat]
    sends: [DisplayCommand]