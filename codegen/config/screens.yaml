screens:
  Main:
    tick_phases: null
    receives:
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - TemperatureStatus 
      - TemperatureSample 
      - ActiveBehaviourChanged
      - FermentationStatus
      - DisplayStatus
    sends: 
      - DisplayCommand
    updaters: 
      FanState: 
        - FromEvent(FanStatus, state)
        - FromEvent(FanStatus, targetSpeed)
      FanMeasuredRpm: 
        - FromEvent(FanSample, measuredRpm)
      HeatpadState:
        - FromEvent(HeatpadStatus, state)
      HeatpadDuty: 
        - FromEvent(HeatpadStatus, currentDutyCycle)
        - FromEvent(HeatpadStatus, currentPeriodMicros)
        - FromEvent(HeatpadStatus, nextDutyCycle)
        - FromEvent(HeatpadStatus, nextPeriodMicros)
      BoxPosition:
        - FromEvent(HeatpadSample, pwmProgressMicros)
      HeatpadSense: 
        - FromEvent(HeatpadSample, measuredVoltage, epsilon=1e-3)
        - FromEvent(HeatpadSample, measuredCurrent, epsilon=1e-3)
      DisplayStatus: 
        - FromEvent(DisplayStatus, brightness)
        - FromEvent(DisplayStatus, skipped)
        - Manual(dirtyCount, uint32_t)
      ShtState: 
        - FromEvent(TemperatureStatus, driverEnabled)
        - FromEvent(TemperatureStatus, powerEnabled)
        - FromEvent(TemperatureStatus, resetting)
      ShtSample: 
        - FromEvent(TemperatureSample, temperatureCelcius)
        - FromEvent(TemperatureSample, humidityRelative)
      HeapSpace:
        - Manual(heapSpace, uint32_t) 
      AppState:
        - Manual(eventCount, uint32_t)
        - FromEvent(ActiveBehaviourChanged, newBehaviour)
      FermentationStatus: 
        - FromEvent(FermentationStatus, heaterEngineState)
        - FromEvent(FermentationStatus, targetTemperature)
        - FromEvent(FermentationStatus, measuredTemperature)
        - FromEvent(FermentationStatus, measuredHumidity)

  Debug:
    tick_phases: null
    receives: [Heartbeat]
    sends: [DisplayCommand]