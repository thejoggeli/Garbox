screens:
  Main:
    tick_phases: null
    receives:
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - TemperatureStatus 
      - TemperatureSample 
      - ActiveBehaviourChanged
      - FermentationStatus
      - DisplayStatus
    sends: 
      - DisplayCommand
    updaters: 
      FanState: 
        - FanStatus(state)
        - FanStatus(targetSpeed)
      FanMeasuredRpm: 
        - FanSample(measuredRpm)
      HeatpadState:
        - HeatpadStatus(state)
      HeatpadDuty: 
        - HeatpadStatus(currentDutyCycle)
        - HeatpadStatus(currentPeriodMicros)
        - HeatpadStatus(nextDutyCycle)
        - HeatpadStatus(nextPeriodMicros)
      BoxPosition:
        - HeatpadStatus(pwmProgressMicros)
      HeatpadSense: 
        - HeatpadSample(measuredVoltage)
        - HeatpadSample(measuredCurrent)
      DisplayStatus: 
        - DisplayStatus(brightness)
        - DisplayStatus(skipped)
        - dirtyCount
      ShtState: 
        - TemperatureStatus(driverEnabled)
        - TemperatureStatus(powerEnabled)
        - TemperatureStatus(resetting)
      ShtSample: 
        - TemperatureSample(temperatureCelcius)
        - TemperatureSample(humidityRelative)
      HeapSpace:
        - heapSpace
      AppState:
        - eventCount
        - ActiveBehaviourChanged(behaviour)
      FermentationStatus: 
        - FermentationStatus(heaterEngineState)
        - FermentationStatus(targetTemperature)
        - FermentationStatus(measuredTemperature)
        - FermentationStatus(measuredHumidity)


  Debug:
    tick_phases: null
    receives: [Heartbeat]
    sends: [DisplayCommand]
    
      

        - HeatpadState -> currentDutyCycle
        - HeatpadState -> currentPeriodMicros
        - HeatpadState -> nextDutyCycle
        - HeatpadState -> nextPeriodMicros