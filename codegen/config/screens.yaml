screens:

  Main:
    subdir: main
    renderer: lvgl-gui # lvgl-simple or lvgl-gui 
    renderer_gui: MainScreen.xml
    render_fns: 
      - FanInfo 
      - PowerInfo 
      - HumidityInfo
      - StatusInfo
      - MeasuredTemperatureSample
      - MeasuredTemperatureLabel
      - TargetTemperatureSample
      - HeatpadPowerSample
      - HeatpadPowerLabel
    read_states: 
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - TemperatureStatus
      - TemperatureSample
      - FermentationStatus

  Debug:
    subdir: debug
    renderer: lvgl-simple # lvgl-simple or lvgl-gui 
    render_fns:
      - FanState 
      - FanMeasuredRpm 
      - HeatpadState 
      - HeatpadDuty 
      - HeatpadSense
      - HeatpadProgress 
      - DisplayStatus 
      - TemperatureState 
      - TemperatureSample 
      - Time 
      - AppInfo 
      - FermentationStatus 
      - HeapBlocks
      - HeapBytes
      - HeapMinimum
    read_states:
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - HeatpadProgress
      - DisplayStatus
      - DisplayDiagnostics
      - TemperatureStatus
      - TemperatureSample
      - ActiveBehaviour
      - ActiveScreen
      - FermentationStatus

  EventLog:
    subdir: log
    renderer: lvgl-simple # lvgl-simple or lvgl-gui 
    receive_events_all: true
    
  StateLog:
    subdir: log
    renderer: lvgl-simple # lvgl-simple or lvgl-gui 
    read_states_all: true