controllers:

  DisplayController:
    subdir: "hmi"
    tick_phases: Render
    receive_events: [DisplayCommand]
    send_events: [DisplayStatus]
    write_states: [DisplayStatus, DisplayDiagnostics]

  DevtoolsController:
    subdir: "devtools"
    tick_phases: Logging

  FanController:
    subdir: "actuators"
    tick_phases: [Input, Output]
    receive_events: [FanCommand]
    send_events: [FanStatus, FanSample]
    write_states: [FanStatus, FanSample]

  HeartbeatController:
    subdir: "heartbeat"
    tick_phases: Heartbeat
    send_events: Heartbeat

  HeatpadController:
    subdir: "actuators"
    tick_phases: [Input, Output]
    receive_events: [HeatpadCommand]
    send_events: [HeatpadStatus, HeatpadSample]
    write_states: [HeatpadStatus, HeatpadSample]

  InputController:
    subdir: "hmi"
    tick_phases: [Input]
    send_events: [ButtonStateChanged, ButtonRepeat, EncoderStep]

  I2cPartsController:
    subdir: "sensors"
    tick_phases: [Input]
    receive_events: [ButtonStateChanged]
    send_events: [TemperatureStatus, TemperatureSample]
    write_states: [TemperatureStatus, TemperatureSample]

