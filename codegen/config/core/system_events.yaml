event_payloads:

  include_h: 
    - "shared/types/BehaviourId.h"
    - "shared/types/ScreenId.h"

event_types:

  ActiveBehaviourChanged:
    - Field(oldBehaviour, BehaviourId)
    - Field(newBehaviour, BehaviourId)

  ActiveScreenChanged:
    - Field(oldScreen, ScreenId)
    - Field(newScreen, ScreenId)
    