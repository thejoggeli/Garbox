# The generated runtime instance will be called NameRuntime
name: Garbox

### General ###
initial_behaviour: CalibrationBehaviour
tick_period_millis: 30
tick_phases: [
  { name: Heartbeat },
  { name: Input },
  { name: Logic },
  { name: Output },
  { name: Render, delay_until_millis: 20 }
]

### Controllers ###
controllers:

  DisplayController:
    tick_phases: Render
    receives:
      - FanStatus
      - FanSample
      - HeatpadStatus
      - HeatpadSample
      - TemperatureStatus 
      - TemperatureSample 
      - BacklightCommand 
      - ActiveBehaviourChanged
    sends: null

  FanController:
    tick_phases: [Input, Output]
    receives: [FanCommand]
    sends: [FanStatus, FanSample]

  HeartbeatController:
    tick_phases: [Heartbeat]
    receives: null
    sends: [Heartbeat]

  HeatpadController:
    tick_phases: [Input, Output]
    receives: [HeatpadCommand]
    sends: [HeatpadStatus, HeatpadSample]

  InputController:
    tick_phases: [Input]
    receives: null
    sends: [ButtonStateChanged, ButtonRepeat, EncoderStep]

  I2cPartsController:
    tick_phases: [Input]
    receives: [ButtonStateChanged]
    sends: [TemperatureStatus, TemperatureSample]

### Behaviours ###
behaviours:

  CalibrationBehaviour:
    tick_phases: [Logic]
    receives: [Heartbeat, FanStatus, FanSample]
    sends: [FanCommand]

  FermentationBehaviour:
    tick_phases: [Logic]
    receives: [Heartbeat, FanStatus, FanSample, HeatpadStatus, TemperatureStatus, TemperatureSample, ButtonStateChanged, ButtonRepeat, EncoderStep]
    sends: [FanCommand, BacklightCommand, HeatpadCommand]
