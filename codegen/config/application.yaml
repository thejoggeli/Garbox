# The generated runtime instance will be called NameRuntime
name: Garbox

controllers:

  DisplayController:
    ticks: [Render]
    sends: null
    receives: null

  FanController:
    ticks: [Input, Output]
    sends: [FanStatus, FanSample]
    receives: [FanCommand]

  HeartbeatController:
    ticks: [Heartbeat]
    sends: [Heartbeat]
    receives: null

  HeatpadController:
    ticks: [Input, Output]
    sends: [HeatpadStatus]
    receives: [HeatpadCommand]

  InputController:
    ticks: [Input]
    sends: [Button, ButtonRepeat, EncoderStep]
    receives: null

  I2cPartsController:
    ticks: [Input]
    sends: [TemperatureStatus, TemperatureSample]
    receives: null

initial_behaviour: FermentationBehaviour
behaviours:
  FermentationBehaviour:
    ticks: [Logic]
    sends: [FanCommand, HeatpadCommand]
    receives: [Heartbeat, FanStatus, FanSample, HeatpadStatus, TemperatureStatus, TemperatureSample, Button, ButtonRepeat, EncoderStep, ]
