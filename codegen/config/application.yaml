# The generated runtime instance will be called NameRuntime
name: Garbox

### Controllers ###
controllers:

  DisplayController:
    ticks: [Render]
    receives: [TemperatureStatus, TemperatureSample, BacklightCommand, ActiveBehaviourChanged]
    sends: null

  FanController:
    ticks: [Input, Output]
    receives: [FanCommand]
    sends: [FanStatus, FanSample]

  HeartbeatController:
    ticks: [Heartbeat]
    receives: null
    sends: [Heartbeat]

  HeatpadController:
    ticks: [Input, Output]
    receives: [HeatpadCommand]
    sends: [HeatpadStatus]

  InputController:
    ticks: [Input]
    receives: null
    sends: [ButtonStateChanged, ButtonRepeat, EncoderStep]

  I2cPartsController:
    ticks: [Input]
    receives: [ButtonStateChanged]
    sends: [TemperatureStatus, TemperatureSample]

### General ###
initial_behaviour: CalibrationBehaviour

### Behaviours ###
behaviours:

  CalibrationBehaviour:
    ticks: [Logic]
    receives: [Heartbeat, FanStatus, FanSample]
    sends: [FanCommand]

  FermentationBehaviour:
    ticks: [Logic]
    receives: [Heartbeat, FanStatus, FanSample, HeatpadStatus, TemperatureStatus, TemperatureSample, ButtonStateChanged, ButtonRepeat, EncoderStep]
    sends: [FanCommand, BacklightCommand, HeatpadCommand]
