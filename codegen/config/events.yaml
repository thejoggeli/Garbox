payload:

  include_h: [
    "modules/parts/button/ButtonState.h",
    "modules/parts/fan/FanState.h",
    "modules/parts/heatpad/HeatpadState.h"
  ]

type:

  include_h: []
  include_cpp: []

  # Heartbeat
  Heartbeat: null

  # Fan
  FanStatus:  
    state: FanState
    targetSpeed: float
  FanSample:  
    measuredRpm: float
  FanCommand:  
    enabled: bool
    targetSpeed: float
  
  # Heatpad
  HeatpadStatus:  
    state: HeatpadState 
    dutyCycle: float
    periodMicros: uint32_t
  HeatpadCommand:  
    enabled: bool
    dutyCycle: float
    periodMicros: uint32_t
  
  # Temperature
  TemperatureStatus:  
    enabled: bool
    error: bool
  TemperatureSample:  
    temperatureCelcius: float
    humidityRelative: float
  
  # Encoder
  Button:  
    state: ButtonState
  ButtonRepeat:  
    count: uint32_t
  EncoderStep:  
    steps: int32_t
  