events:

  payloads_meta:
    include_h: [
      "app/engine/HeaterEngineState.h",
      "modules/parts/button/ButtonState.h",
      "modules/parts/fan/FanState.h",
      "modules/parts/heatpad/HeatpadState.h"
    ]

  types:

    ### Heartbeat ###
    Heartbeat: null

    ## Fermentation ###
    FermentationStatus:
      heaterEngineState: HeaterEngineState
      targetTemperature: float
      measuredTemperature: float
      measuredHumidity: float

    ### Display ###
    DisplayCommand:
      brightness: float

    DisplayStatus:
      brightness: float
      skipped: uint32_t

    ### Fan ###
    FanStatus:  
      state: FanState
      targetSpeed: float # DutyCycle or RPM (depending on rpmControlEnabled)
      rpmControlEnabled: bool

    FanSample:  
      measuredRpm: float

    FanCommand:  
      enabled: bool
      targetSpeed: float # DutyCycle or RPM (depending on enableRpmControl) 
      enableRpmControl: bool

    ### Heatpad ###
    HeatpadStatus:  
      state: HeatpadState 
      currentDutyCycle: float
      currentPeriodMicros: uint32_t
      nextDutyCycle: float
      nextPeriodMicros: uint32_t

    HeatpadSample:  
      measuredVoltage: float
      measuredCurrent: float
      pwmProgressMicros: float
      
    HeatpadCommand:  
      enabled: bool
      dutyCycle: float
      periodMicros: uint32_t
    
    ### Temperature ###
    TemperatureStatus:
      driverEnabled: bool  
      powerEnabled: bool
      resetting: bool

    TemperatureSample:  
      temperatureCelcius: float
      humidityRelative: float
    
    ### Button ###
    ButtonStateChanged:  
      oldState: ButtonState 
      newState: ButtonState

    ButtonRepeat:  
      count: uint32_t
      holdTimeMicros: uint32_t

    ### Encoder ###
    EncoderStep:  
      steps: int32_t
    