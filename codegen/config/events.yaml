payloads:

  include_h: [
    "modules/parts/button/ButtonState.h",
    "modules/parts/fan/FanState.h",
    "modules/parts/heatpad/HeatpadState.h"
  ]

types:

  ### Heartbeat ###
  Heartbeat: null

  ### Display ###
  BacklightCommand:
    brightness: float

  ### Fan ###
  FanStatus:  
    state: FanState
    targetSpeed: float

  FanSample:  
    measuredRpm: float

  FanCommand:  
    enabled: bool
    targetSpeed: float

  ### Heatpad ###
  HeatpadStatus:  
    state: HeatpadState 
    dutyCycle: float
    periodMicros: uint32_t

  HeatpadSample:  
    state: HeatpadState 
    measuredVoltage: float
    measuredCurrent: float
    
  HeatpadCommand:  
    enabled: bool
    dutyCycle: float
    periodMicros: uint32_t
  
  ### Temperature ###
  TemperatureStatus:
    driverEnabled: bool  
    powerEnabled: bool
    resetting: bool

  TemperatureSample:  
    temperatureCelcius: float
    humidityRelative: float
  
  ### Button ###
  ButtonStateChanged:  
    oldState: ButtonState 
    newState: ButtonState

  ButtonRepeat:  
    count: uint32_t

  ### Encoder ###
  EncoderStep:  
    steps: int32_t
  